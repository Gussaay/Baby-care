name: Build and deploy (web + Android)

# Same idea as Easy Pedia, kept small:
#   - every push to the main branch builds the web app, deploys it to
#     Firebase Hosting (https://baby-care-play.web.app), builds the Android APK
#     and publishes it as a GitHub Release
#     (https://baby-care-play.web.app/download/baby-care.apk redirects to it);
#   - every pull request gets a temporary Firebase preview link.
on:
  push:
    branches: [main, ccr-0387cb8d-xscbwu]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: baby-care.apk

jobs:
  web:
    name: Test, build and deploy web
    runs-on: ubuntu-latest
    env:
      # Created with `firebase init hosting:github`, or by pasting a service-account
      # JSON key into GitHub > Settings > Secrets and variables > Actions.
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BABY_CARE_PLAY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Firebase secret missing
        if: env.HAS_FIREBASE != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT_BABY_CARE_PLAY repository secret to publish to Firebase Hosting. The build itself passed."

      - name: Deploy preview (pull request)
        if: env.HAS_FIREBASE == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BABY_CARE_PLAY }}
          projectId: baby-care-play

      - name: Deploy live
        if: env.HAS_FIREBASE == 'true' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BABY_CARE_PLAY }}
          projectId: baby-care-play
          channelId: live

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Build web and sync Android
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          npx cap sync android
          sed -i -e "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" \
                 -e "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle

      # Debug-signed until a release keystore is added (like Easy Pedia's KEYSTORE_* secrets).
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Baby care v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android app for Baby care (English + العربية).
            Download: https://baby-care-play.web.app/download/baby-care.apk
            Web app: https://baby-care-play.web.app
          files: ${{ env.APK_NAME }}
